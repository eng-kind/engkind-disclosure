name: KIND 공시 30분 확인

on:
  schedule:
    # 30분마다 (UTC 기준 매시 5분·35분). GitHub 사정으로 몇 분~수십 분 늦게 시작될 수 있습니다.
    - cron: "5,35 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kind-collect
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  DATA_BRANCH: data
  STATE_PATH: data/disclosure_state.json
  STATUS_PATH: data/collector_status.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-collector.txt

      - run: pip install -r app/requirements-collector.txt

      - name: KIND 오늘의 공시 조회
        id: fetch
        continue-on-error: true
        run: python app/kind_collector.py fetch --out fetched.json --debug-dir debug

      - name: data 브랜치에 결과 저장
        working-directory: app
        run: |
          git config user.name "engkind"
          git config user.email "engkind@krx.co.kr"
          SEED=""
          for f in initial_disclosures.json data/initial_disclosures.json; do
            [ -f "$f" ] && SEED="$PWD/$f" && break
          done
          for attempt in 1 2 3; do
            rm -rf ../state; git worktree prune
            if git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then
              git worktree add -B "$DATA_BRANCH" ../state "origin/$DATA_BRANCH"
            else
              # 첫 실행: 자료 전용 data 브랜치를 새로 만든다 (앱 코드와 분리)
              git worktree add --detach ../state
              (cd ../state && git checkout --orphan "$DATA_BRANCH" && git rm -rfq . && git clean -fdq)
            fi
            python kind_collector.py merge --fetched ../fetched.json \
              --state "../state/$STATE_PATH" --status "../state/$STATUS_PATH" \
              --app-dir . ${SEED:+--seed "$SEED"}
            cd ../state
            git add -A data
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -qm "KIND 확인 $(date '+%Y-%m-%d %H:%M') KST"
            if git push origin "HEAD:$DATA_BRANCH"; then exit 0; fi
            echo "다른 저장과 겹쳐 다시 시도합니다 ($attempt/3)"
            cd ../app; sleep $((attempt * 5))
          done
          exit 1

      - name: 실패 시 KIND 응답 보관
        if: steps.fetch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: kind-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: KIND 조회 실패 표시
        if: steps.fetch.outcome == 'failure'
        run: |
          python -c "import json;print('::error::'+json.load(open('fetched.json'))['error'])"
          exit 1
